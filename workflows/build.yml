
name: Build RegionHelper

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: .\gradlew.bat --no-daemon --no-watch-fs --max-workers=2 --console=plain clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RegionHelper-Fabric-1.21.4
          path: build/libs/*.jar
          if-no-files-found: error
